<!DOCTYPE HTML>
<html>
	<head>
		<title>Sun Electric - Signup</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Page Wrapper -->
			<div id="page-wrapper">

				<!-- Header -->
					<header id="header">
						<h1><a href="index.html">SUN ELECTRIC</a></h1>
						<nav id="nav">
							<ul>
								<li class="special">
									<a href="#menu" class="menuToggle"><span>Menu</span></a>
									<div id="menu">
										<ul>
											<li><a href="index.html">Home</a></li>
											<li><a href="connect.html">Connect</a></li>
											<li><a href="#">Log In</a></li>
										</ul>
									</div>
								</li>
							</ul>
						</nav>
					</header>

				<!-- Main -->
					<article id="main">
						<header>
							<h2>Sign up</h2>
							<p>Get in touch with us</p>
						</header>
						<section class="wrapper style5">
							<div class="inner">
								<section>
									<h4>Your Information</h4>
									<p>Fill in the below form and we will get back to you the soonest.</p>
									<form id="contact-form">
										<div class="row gtr-uniform">
											<div class="col-6 col-12-xsmall">
												<input type="text" name="name" id="name" value="" placeholder="Name" onfocus="clearError(this)"/>
											</div>
											<div class="col-6 col-12-xsmall">
												<input type="text" name="company" id="company" value="" placeholder="Company" onfocus="clearError(this)"/>
											</div>
											<div class="col-12 col-12-xsmall">
												<input type="email" name="email" id="email" value="" placeholder="Email" onfocus="clearError(this)"/>
											</div>
											<div class="col-12">
												<select name="category" id="category" onfocus="clearError(this)">
													<option value="">- Your interest -</option>
													<option value="Consumer">Consumer</option>
													<option value="Generator">Generator</option>
													<option value="Installer">Installer</option>
													<option value="Other">Other</option>
												</select>
											</div>
											<div class="col-12 potty">
												<input type="text" name="occupation" id="occupation" value="" placeholder="Occupation" onfocus="clearError(this)"/>
											</div>
											<div class="col-12">
												<textarea name="message" id="message" placeholder="Enter your message" rows="6" onfocus="clearError(this)"></textarea>
											</div>
											<div class="col-12">
												<ul class="actions">
													<li><input type="button" value="Send Message" class="primary" onclick="validateForm()"/></li>
													<li><input type="reset" value="Reset" onclick="clearAllErrors()"/></li>
												</ul>
											</div>
										</div>
									</form>
								</section>
							</div>
						</section>
					</article>
				<!-- Footer -->
					<footer id="footer">
						<ul class="icons">
							<li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
							<li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
							<li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
							<li><a href="#" class="icon brands fa-dribbble"><span class="label">Dribbble</span></a></li>
							<li><a href="#" class="icon solid fa-envelope"><span class="label">Email</span></a></li>
						</ul>
						<ul class="copyright">
							<li>&copy; 2025 Sun Electric</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
						</ul>
					</footer>

			</div>

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrollex.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
			<script src="assets/js/form.js"></script>
	</body>
</html>
